<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999">
  @for (toast of toastService.toasts$(); track toast.id) {
    <div
      class="toast show align-items-center text-white border-0 mb-2 shadow-lg animate-toast"
      [class.bg-success]="toast.type === 'success'"
      [class.bg-danger]="toast.type === 'danger'"
      [class.bg-warning]="toast.type === 'warning'"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex p-2">
        <div class="toast-body d-flex align-items-center">
            <i class="bi me-2 fs-5"
               [class.bi-check-circle]="toast.type === 'success'"
               [class.bi-x-circle]="toast.type === 'danger'"
               [class.bi-exclamation-triangle]="toast.type === 'warning'">
            </i>
            {{ toast.message }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="toastService.remove(toast.id)"></button>
      </div>
    </div>
  }
</div>
