<div class="col-md-12 register-container">
  <div class="card card-container">
    <img
      id="profile-img"
      src="//ssl.gstatic.com/accounts/ui/avatar_2x.png"
      class="profile-img-card"
    />
    <form
      *ngIf="!isSuccessful"
      name="form"
      (ngSubmit)="f.form.valid && onSubmit()"
      #f="ngForm"
      novalidate
    >
      <div class="form-group">
        <label for="fullName">Nombre Completo</label>
        <input
          type="text"
          class="form-control"
          name="fullName"
          [(ngModel)]="form.fullName"
          required
          #fullName="ngModel"
          [ngClass]="{ 'is-invalid': f.submitted && fullName.errors }"
        />
      </div>
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          class="form-control"
          name="username"
          [(ngModel)]="form.username"
          required
          minlength="3"
          maxlength="20"
          #username="ngModel"
          [ngClass]="{ 'is-invalid': f.submitted && username.errors }"
        />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          class="form-control"
          name="email"
          [(ngModel)]="form.email"
          required
          email
          #email="ngModel"
          [ngClass]="{ 'is-invalid': f.submitted && email.errors }"
        />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          class="form-control"
          name="password"
          [(ngModel)]="form.password"
          required
          minlength="6"
          #password="ngModel"
          [ngClass]="{ 'is-invalid': f.submitted && password.errors }"
        />
      </div>
      <div class="form-group mt-3">
        <button class="btn btn-primary btn-block w-100">Registrarse</button>
      </div>

      <div class="alert alert-warning mt-2" *ngIf="f.submitted && isSignUpFailed">
        {{ errorMessage }}
      </div>
    </form>

    <div class="alert alert-success" *ngIf="isSuccessful">
      ¡Registro exitoso! Ya puedes iniciar sesión.
    </div>
  </div>
</div>
