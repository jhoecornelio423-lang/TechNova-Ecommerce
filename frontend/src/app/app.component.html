<div class="main-wrapper" [class.admin-layout]="isAdminPage">

  <!-- Sistema de Notificaciones Global -->
  <app-toast></app-toast>
  <app-confirm-modal></app-confirm-modal>

  <!-- Carrito Lateral (Solo visible si showCart es true) -->
  @if (showCart) {
    <app-cart (closeCart)="showCart = false"></app-cart>
  }

  <!-- BARRA SUPERIOR (Solo para Clientes) -->
  <nav *ngIf="!isAdminPage" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" routerLink="/">
        <i class="bi bi-shop me-2"></i> TechNova
      </a>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/home" routerLinkActive="active">Inicio</a>
          </li>
        </ul>

        <ul class="navbar-nav ms-auto align-items-center">
          <!-- Icono del Carrito con Badge -->
          <li class="nav-item me-3">
            <button class="btn btn-link nav-link position-relative p-0 border-0" (click)="toggleCart()">
              <i class="bi bi-cart3 fs-4 text-white"></i>
              <span *ngIf="cartService.totalItems() > 0"
                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                    style="font-size: 0.65rem;">
                {{ cartService.totalItems() }}
              </span>
            </button>
          </li>

          <li class="nav-item" *ngIf="!isLoggedIn">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">Login</a>
          </li>
          <li class="nav-item" *ngIf="!isLoggedIn">
            <a class="nav-link" routerLink="/register" routerLinkActive="active">Registrarse</a>
          </li>

          <li class="nav-item" *ngIf="isLoggedIn && showAdminBoard">
            <a class="nav-link text-warning" routerLink="/admin">
              <i class="bi bi-speedometer2"></i> Panel Admin
            </a>
          </li>
          <li class="nav-item" *ngIf="isLoggedIn">
            <a class="nav-link" routerLink="/my-orders"><i class="bi bi-list-check"></i> Mis Pedidos</a>
          </li>
          <li class="nav-item" *ngIf="isLoggedIn">
            <a class="nav-link" routerLink="/profile"><i class="bi bi-person-circle"></i> {{ displayName }}</a>
          </li>
          <li class="nav-item" *ngIf="isLoggedIn">
            <a class="nav-link" (click)="logout()" style="cursor: pointer;">Cerrar Sesión</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="d-flex content-container">

    <!-- SIDEBAR LATERAL (Control Manual) -->
    <aside *ngIf="isAdminPage" class="sidebar bg-dark text-white shadow-lg" [class.collapsed]="isSidebarCollapsed">
      <!-- Header del Sidebar como Link al Dashboard -->
      <div class="sidebar-header p-3 border-bottom border-secondary d-flex align-items-center clickable-header"
           routerLink="/admin" [title]="isSidebarCollapsed ? 'Dashboard' : ''">
        <i class="bi bi-person-circle me-3 fs-4 text-warning"></i>
        <span class="menu-text fw-bold" *ngIf="!isSidebarCollapsed">TechNova Admin</span>
      </div>

      <div class="sidebar-menu flex-grow-1 p-2">
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a routerLink="/admin/inventory" routerLinkActive="active"
               class="nav-link text-white d-flex align-items-center" [title]="isSidebarCollapsed ? 'Inventario' : ''">
              <i class="bi bi-box-seam fs-4" [class.me-3]="!isSidebarCollapsed"></i>
              <span class="menu-text" *ngIf="!isSidebarCollapsed">Inventario</span>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/admin/categories" routerLinkActive="active"
               class="nav-link text-white d-flex align-items-center" [title]="isSidebarCollapsed ? 'Categorías' : ''">
              <i class="bi bi-tags fs-4" [class.me-3]="!isSidebarCollapsed"></i>
              <span class="menu-text" *ngIf="!isSidebarCollapsed">Categorías</span>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/admin/users" routerLinkActive="active"
               class="nav-link text-white d-flex align-items-center" [title]="isSidebarCollapsed ? 'Usuarios' : ''">
              <i class="bi bi-people fs-4" [class.me-3]="!isSidebarCollapsed"></i>
              <span class="menu-text" *ngIf="!isSidebarCollapsed">Usuarios</span>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/admin/reports" routerLinkActive="active"
               class="nav-link text-white d-flex align-items-center" [title]="isSidebarCollapsed ? 'Reportes' : ''">
              <i class="bi bi-bar-chart-line fs-4" [class.me-3]="!isSidebarCollapsed"></i>
              <span class="menu-text" *ngIf="!isSidebarCollapsed">Reportes</span>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/admin/orders" routerLinkActive="active"
               class="nav-link text-white d-flex align-items-center" [title]="isSidebarCollapsed ? 'Pedidos' : ''">
              <i class="bi bi-truck fs-4" [class.me-3]="!isSidebarCollapsed"></i>
              <span class="menu-text" *ngIf="!isSidebarCollapsed">Pedidos</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer p-3 border-top border-secondary">
        <a routerLink="/home" class="nav-link text-white p-2 d-flex align-items-center mb-2" [title]="isSidebarCollapsed ? 'Ir a Tienda' : ''">
          <i class="bi bi-arrow-left fs-4" [class.me-3]="!isSidebarCollapsed"></i>
          <span class="menu-text" *ngIf="!isSidebarCollapsed">Ir a Tienda</span>
        </a>
        <button (click)="logout()" class="btn-logout-custom d-flex align-items-center" [title]="isSidebarCollapsed ? 'Salir' : ''">
          <i class="bi bi-box-arrow-right fs-4" [class.me-3]="!isSidebarCollapsed"></i>
          <span class="menu-text" *ngIf="!isSidebarCollapsed">Salir</span>
        </button>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL - Contenedor Unificado -->
    <main class="flex-grow-1 main-content" [class.admin-main]="isAdminPage">
      <!-- Botón de Toggle Sutil (Solo en Admin) -->
      <div *ngIf="isAdminPage" class="p-4 pb-0">
        <button class="btn-toggle-subtle" (click)="toggleSidebar()">
          <i class="bi" [class.bi-list]="isSidebarCollapsed" [class.bi-text-indent-left]="!isSidebarCollapsed"></i>
        </button>
      </div>

      <div [class.container]="!isAdminPage" [class.p-4]="isAdminPage">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>
</div>
